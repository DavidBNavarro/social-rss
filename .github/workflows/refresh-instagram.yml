name: Refresh Instagram feeds

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-feeds
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INSTAGRAM_COOKIE: ${{ secrets.INSTAGRAM_COOKIE }}
      TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Start RSSHub
        run: |
          IG_COOKIE="$(printf '%s' "${INSTAGRAM_COOKIE:-}" | tr -d '\r\n' | sed -e 's/^[Cc]ookie:[[:space:]]*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/;[[:space:]]*/; /g' -e 's/;[[:space:]]*$//')"
          echo "INSTAGRAM_COOKIE length=${#IG_COOKIE}"
          echo "has_sessionid=$([[ "$IG_COOKIE" == *"sessionid="* ]] && echo yes || echo no)"
          echo "has_ds_user_id=$([[ "$IG_COOKIE" == *"ds_user_id="* ]] && echo yes || echo no)"
          if [[ -n "$IG_COOKIE" ]] && { [[ "$IG_COOKIE" != *"sessionid="* ]] || [[ "$IG_COOKIE" != *"ds_user_id="* ]]; }; then
            echo "INSTAGRAM_COOKIE must contain sessionid and ds_user_id" >&2
            exit 1
          fi
          docker run -d --name rsshub -p 1200:1200 \
            -e NODE_ENV=production \
            -e CACHE_TYPE=memory \
            -e CACHE_EXPIRE=60 \
            -e DISALLOW_ROBOT=true \
            -e INSTAGRAM_COOKIE="$IG_COOKIE" \
            -e TWITTER_AUTH_TOKEN \
            diygod/rsshub:2026-11-05
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1200/healthz >/dev/null; then
              echo "RSSHub is up"
              exit 0
            fi
            sleep 2
          done
          docker logs rsshub
          exit 1

      - name: Fetch Instagram feeds
        run: ./scripts/fetch-static.sh instagram

      - name: RSSHub logs
        if: failure()
        run: docker logs --tail 120 rsshub || true

      - name: Generate OPML
        run: ./scripts/gen-opml-static.sh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feeds/instagram docs/feeds.opml
          git diff --cached --quiet || git commit -m "feeds: refresh Instagram"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Stop RSSHub
        if: always()
        run: docker rm -f rsshub || true
