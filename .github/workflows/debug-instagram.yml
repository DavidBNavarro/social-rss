name: Debug Instagram frontends

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start RSSHub with Chromium
        run: |
          docker run -d --name rsshub -p 1200:1200 --shm-size=1g \
            -e NODE_ENV=production \
            -e CACHE_TYPE=memory \
            -e CACHE_EXPIRE=60 \
            -e DISALLOW_ROBOT=true \
            diygod/rsshub:chromium-bundled-2026-11-05
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:1200/healthz >/dev/null; then
              echo "RSSHub is up"
              exit 0
            fi
            sleep 2
          done
          docker logs rsshub
          exit 1

      - name: Test frontend routes
        run: |
          for path in /picuki/profile/stefaniejoosten /picnob/user/stefaniejoosten; do
            echo "== $path"
            code=$(curl -sS -m 120 -o /tmp/out.html -w '%{http_code}' "http://localhost:1200$path" || true)
            echo "HTTP $code size $(wc -c < /tmp/out.html)"
            echo "items $(grep -o '<item>' /tmp/out.html | wc -l)"
            grep -o 'Error Message:[^<]*' /tmp/out.html | head -1 || true
            head -c 260 /tmp/out.html; echo
          done

      - name: RSSHub logs
        if: always()
        run: docker logs --tail 120 rsshub || true

      - name: Stop RSSHub
        if: always()
        run: docker rm -f rsshub || true
